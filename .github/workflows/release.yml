name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0 or 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Tag and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version.json on master
        id: update_version
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          TAG="${VERSION}"
          echo "Release tag: ${TAG}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

          # Verify tag does not already exist
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Error: Tag '${TAG}' already exists." >&2
            exit 1
          fi

          git checkout master

          export TAG="${VERSION}"
          export VERSION="${VERSION}"

          # Extract commit SHA from master HEAD before release commit
          export RELEASE_COMMIT_SHA=$(git rev-parse --short HEAD)
          export RELEASE_COMMIT_FULL_SHA=$(git rev-parse HEAD)

          # Generate version.json
          node -e "
            const fs = require('fs');
            const data = {
              version: process.env.VERSION,
              tag: process.env.TAG,
              sha: process.env.RELEASE_COMMIT_SHA,
              fullSha: process.env.RELEASE_COMMIT_FULL_SHA,
              commitUrl: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/commit/' + process.env.RELEASE_COMMIT_FULL_SHA,
              date: new Date().toISOString()
            };
            fs.writeFileSync('version.json', JSON.stringify(data, null, 2) + '\n');
          "

          git add version.json
          git commit -m "chore(release): update version.json for ${TAG} (${RELEASE_COMMIT_SHA})"
          git push origin master

      - name: Tag release on master
        run: |
          # Tag the release commit on master
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Merge release into latest branch
        run: |
          # Check if remote 'latest' branch already exists
          if git ls-remote --exit-code --heads origin latest >/dev/null 2>&1; then
            echo "Branch 'latest' exists on remote. Checking out and merging..."
            git checkout latest
            git pull origin latest
            git merge -X theirs --no-edit "${TAG}" -m "Merge tag '${TAG}' into latest"
          else
            echo "Branch 'latest' does not exist yet. Creating from '${TAG}'..."
            git checkout -b latest "${TAG}"
          fi

          # Push latest branch to remote
          git push origin latest

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --generate-notes
