<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Mobile-friendly bookmarks directory sorted with the most clicked on top.">
  <title>Useful Bookmarks - Most Clicked</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">
</head>
<body>
  <!-- Header -->
  <header class="mobile-header">
    <div class="container mobile-header-container">
      <div class="mobile-header-top">
        <div class="mobile-brand">
          <span class="site-icon">🔖</span>
          <div>
            <h1 class="mobile-title" id="mobileSiteTitle">Useful Bookmarks</h1>
            <p class="mobile-subtitle">Most Clicked First</p>
          </div>
        </div>
        <a href="index.html" class="switch-view-btn" title="Switch to Full Categorized View">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Full View
        </a>
      </div>

      <!-- Quick Search -->
      <div class="search-container mobile-search-container">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input 
          type="search" 
          id="mobileSearchInput" 
          class="search-input mobile-search-input" 
          placeholder="Filter bookmarks..." 
          autocomplete="off" 
          spellcheck="false"
        />
        <button id="mobileClearSearchBtn" class="clear-search-btn" aria-label="Clear search" title="Clear">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="container mobile-main">
    <div id="mobileAlertBanner" class="alert-banner" role="alert"></div>

    <div class="mobile-stats-bar">
      <span id="mobileCountStats">Loading bookmarks...</span>
      <span class="sort-badge">🔥 Most clicked on top</span>
    </div>

    <!-- Mobile Bookmark List -->
    <ul id="mobileBookmarksList" class="mobile-bookmarks-list" role="list">
      <!-- Rendered dynamically -->
    </ul>

    <!-- Empty State -->
    <div id="mobileEmptyState" class="empty-state" style="display: none;">
      <div class="empty-icon">🔍</div>
      <h3 class="empty-title">No bookmarks found</h3>
      <p class="empty-desc">Try searching with a different keyword.</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-content">
      <p><a href="index.html">Switch to Full View</a> &bull; Published with ❤️ via GitHub Pages</p>
      <div id="versionBadge" class="version-badge" style="display: none;"></div>
    </div>
  </footer>

  <script src="mobile.js"></script>
</body>
</html>
